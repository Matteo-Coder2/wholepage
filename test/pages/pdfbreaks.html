<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pdfbreaks — dense blocks with whitespace gaps</title>
<style>
  body { margin: 0; }
  /* 2px stripes: every few rows change, so no quiet run can form inside a block */
  .block { height: 360px; background: repeating-linear-gradient(180deg, #333 0 2px, #fff 2px 4px); }
  .gap { height: 40px; background: #fff; }
</style>
</head>
<body>
<script>
  // 17 blocks on a 400px period (360 dense + 40 white). The 400px period is
  // smaller than the plan()'s search window, so a gap is always reachable and
  // every PDF page break must land inside one.
  for (let i = 0; i < 17; i++) document.write('<div class="block"></div><div class="gap"></div>');
</script>
</body>
</html>
