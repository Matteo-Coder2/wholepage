<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { margin: 0; }
  .row { height: 100px; }
  dialog { position: fixed; inset: 0; width: 100vw; height: 100vh;
           max-width: none; max-height: none; border: none; margin: 0; padding: 0;
           background: rgb(200,0,200); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
</style></head><body>
<dialog id="d"></dialog>
<script>
  // Full-screen modal <dialog> open at capture time. It lives in the top layer,
  // covers the whole viewport, and the page behind it (5,000px) is inert but
  // still script-scrollable. Correct output: modal visible once at the top,
  // page content below — not a magenta wall repeated in every tile.
  for (let i = 0; i < 50; i++) {
    const d = document.createElement('div');
    d.className = 'row';
    d.style.background = i % 2 ? 'rgb(235,235,215)' : 'rgb(215,225,240)';
    document.body.appendChild(d);
  }
  document.getElementById('d').showModal();
</script>
</body></html>
