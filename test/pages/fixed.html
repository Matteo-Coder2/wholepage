<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { margin: 0; }
  #hdr { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: rgb(255,0,0); z-index: 10; }
  #cookie { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgb(255,0,255); z-index: 10; }
  #stick { position: sticky; top: 40px; height: 30px; background: rgb(255,128,0); }
  .filler { height: 100px; }
</style></head><body>
<div id="hdr"></div>
<div style="height:80px"></div>
<div id="stick"></div>
<script>
  for (let i = 0; i < 48; i++) {
    const d = document.createElement('div');
    d.className = 'filler';
    d.style.background = i % 2 ? 'rgb(230,230,230)' : 'rgb(200,220,240)';
    document.body.appendChild(d);
  }
</script>
<div id="cookie"></div>
</body></html>
