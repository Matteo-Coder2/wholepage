<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>Wholepage<span class="v">v1.0</span></header>
  <div id="blocked" hidden>
    <p id="blocked-reason"></p>
    <p id="blocked-hint" class="hint"></p>
  </div>
  <div id="modes">
    <button id="mode-full" autofocus>
      <strong>Full page</strong>
      <span>Everything, top to bottom</span>
      <kbd>↵</kbd>
    </button>
    <button id="mode-visible">
      <strong>Visible area</strong>
      <span>Just what's on screen now</span>
    </button>
    <button id="mode-area">
      <strong>Select area</strong>
      <span>Drag a rectangle</span>
    </button>
  </div>
  <div id="progress" hidden>
    <div id="progress-text">Measuring the page…</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <p class="hint">The page scrolls itself and is restored when done.</p>
  </div>
  <div id="error" hidden></div>
  <footer>
    <span class="oath">Runs entirely on this computer</span>
    No account · no cloud · no watermark ·
    <a id="shortcuts-link" href="#">Alt+Shift+P</a> ·
    <a id="options-link" href="#">settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
