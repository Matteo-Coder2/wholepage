<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span id="logo"></span> WholePage</header>
  <div id="blocked" hidden>
    <p id="blocked-reason"></p>
    <p id="blocked-hint" class="hint"></p>
  </div>
  <div id="modes">
    <button id="mode-full">
      <strong>Full page</strong>
      <span>Everything, top to bottom</span>
    </button>
    <button id="mode-visible">
      <strong>Visible area</strong>
      <span>Just what you see now</span>
    </button>
    <button id="mode-area">
      <strong>Select area</strong>
      <span>Drag a rectangle</span>
    </button>
  </div>
  <div id="progress" hidden>
    <div id="progress-text">Capturing…</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <p class="hint">Keep this tab visible — the page scrolls itself and is restored when done.</p>
  </div>
  <div id="error" hidden></div>
  <footer>
    100% local · no account · no tracking ·
    <a id="shortcuts-link" href="#">shortcut: Alt+Shift+P</a> ·
    <a id="options-link" href="#">settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
